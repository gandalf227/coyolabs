<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restablecer contraseña | CoyoLabs</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="mode-login">
  <div class="grid" aria-hidden="true"></div>
  <div class="background" aria-hidden="true">
    <div class="shape one"></div>
    <div class="shape two"></div>
    <div class="shape three"></div>
  </div>

  <div class="auth-layout">
    <main class="card" role="main">
      <div class="card-logo" aria-hidden="true">
        <img src="{{ url_for('static', filename='img/coyolabs.png') }}" alt="CoyoLabs Logo">
      </div>

      <h1 class="title">Restablecer contraseña</h1>
      <p class="subtitle">Define tu nueva contraseña institucional</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash" role="alert" aria-live="polite">
            <ul>
              {% for message in messages %}
                <li>{{ message }}</li>
              {% endfor %}
            </ul>
          </div>
        {% endif %}
      {% endwith %}

      <form class="form" method="post" action="{{ url_for('auth.reset_password', token=token) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
          <label for="password">Nueva contraseña</label>
          <div class="field">
            <input id="password" type="password" name="password" minlength="6" required placeholder="Nueva contraseña">
          </div>
        </div>

        <div>
          <label for="confirm_password">Confirmar nueva contraseña</label>
          <div class="field">
            <input id="confirm_password" type="password" name="confirm_password" minlength="6" required placeholder="Confirma la nueva contraseña">
          </div>
        </div>

        <button type="submit" class="btn">Guardar contraseña</button>
        <a href="{{ url_for('auth.auth_page', mode='login') }}" class="btn btn-secondary" style="text-align:center; text-decoration:none;">
          Volver al acceso
        </a>
      </form>
    </main>
  </div>
</body>
</html>
