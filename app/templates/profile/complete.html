<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completar perfil | CoyoLabs</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f6f8fc;
      margin: 0;
    }

    .container {
      max-width: 620px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #cfd6e4;
      border-radius: 8px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      background: #204eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .flash {
      background: #fff8d5;
      border: 1px solid #f1e09f;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-inline input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Completa tu perfil</h1>
    <p>Antes de continuar en CoyoLabs, registra tu información académica y de contacto.</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash" role="alert" aria-live="polite">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('profile.complete_profile') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="field">
        <label for="full_name">Nombre completo *</label>
        <input
          id="full_name"
          name="full_name"
          placeholder="Ejemplo: María Fernanda López Díaz"
          required
        >
      </div>

      <div class="field">
        <label for="matricula">Matrícula *</label>
        <input
          id="matricula"
          name="matricula"
          placeholder="Ejemplo: 24310116"
          required
        >
      </div>

      <div class="field">
        <label for="career_id">Carrera *</label>
        <select id="career_id" name="career_id" required>
          <option value="">Selecciona una carrera</option>
          {% for career in careers %}
          <option value="{{ career.id }}">{{ career.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="academic_level_id">
          Nivel {% if is_student %}*{% else %}(si aplica){% endif %}
        </label>
        <select
          id="academic_level_id"
          name="academic_level_id"
          {% if is_student %}required{% endif %}
        >
          <option value="">Selecciona nivel</option>
          {% for level in academic_levels %}
          <option value="{{ level.id }}">{{ level.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label for="phone">Teléfono *</label>
        <input
          id="phone"
          name="phone"
          placeholder="Ejemplo: 656-123-4567"
          required
        >
      </div>

      <div class="field">
        <label class="checkbox-inline">
          <input type="checkbox" name="confirm_data" value="1" required>
          <span>Confirmo que mis datos son correctos</span>
        </label>
      </div>

      <button type="submit">Guardar perfil</button>
    </form>
  </main>

  <script id="career-level-map" type="application/json">
    {{ career_level_map | tojson }}
  </script>

  <script>
    (function () {
      const careerSelect = document.getElementById("career_id");
      const levelSelect = document.getElementById("academic_level_id");
      const mapNode = document.getElementById("career-level-map");

      if (!careerSelect || !levelSelect || !mapNode) return;

      let careerLevelMap = {};
      try {
        careerLevelMap = JSON.parse(mapNode.textContent || "{}");
      } catch (error) {
        console.error("No se pudo parsear career_level_map:", error);
        careerLevelMap = {};
      }

      const allLevelOptions = Array.from(levelSelect.querySelectorAll("option"))
        .filter(option => option.value)
        .map(option => ({
          value: String(option.value),
          label: option.textContent
        }));

      function renderLevelOptions() {
        const selectedCareerId = String(careerSelect.value || "");
        const allowedLevelIds = (careerLevelMap[selectedCareerId] || []).map(String);
        const previousValue = String(levelSelect.value || "");

        levelSelect.innerHTML = "";

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Selecciona nivel";
        levelSelect.appendChild(placeholder);

        allLevelOptions
          .filter(option => allowedLevelIds.includes(option.value))
          .forEach(option => {
            const opt = document.createElement("option");
            opt.value = option.value;
            opt.textContent = option.label;
            levelSelect.appendChild(opt);
          });

        if (allowedLevelIds.includes(previousValue)) {
          levelSelect.value = previousValue;
        } else {
          levelSelect.value = "";
        }
      }

      careerSelect.addEventListener("change", renderLevelOptions);
      renderLevelOptions();
    })();
  </script>
</body>
</html>
